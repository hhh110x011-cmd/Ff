name: Windows-11-Tailscale-RDP

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: 1. Cai dat Tailscale he thong qua Choco
      run: |
        choco install tailscale -y --no-progress
        
    - name: 2. Khoi dong dich vu va Ket noi vao mang Tailscale
      run: |
        Start-Service -Name "Tailscale" -ErrorAction SilentlyContinue
        Start-Sleep -Seconds 5
        # Them lenh --unattended de Tailscale chay ngam vinh vien khong can dang nhap tren may ao
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes --unattended
        
    - name: 3. Cau hinh mo khoa va ha cap bao mat RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 1
        Restart-Service -Name "TermService" -Force
        
    - name: 4. Duy tri may ao hoat dong ngam
      run: |
        $User = "runneradmin"
        $Password = "Win11Tailscale2026!"
        echo "===================================================="
        echo "TAI KHOAN RDP: $User"
        echo "MAT KHAU RDP: $Password"
        echo "===================================================="
        while ($true) { Start-Sleep -Seconds 3600 }
        
